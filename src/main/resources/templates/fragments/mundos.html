<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!--
  Cenário de cada tema na tela "Escolha o tema". O nome do fragmento é o slug do Tema.
  Só <span> aqui dentro: o cenário fica dentro de um <button>, que não aceita <div>/<ul>.
-->
<body>

<!-- Padrão: o próprio sistema em miniatura, com as tarefas sendo marcadas uma a uma. -->
<th:block th:fragment="padrao">
    <span class="padrao-janela">
        <span class="padrao-barra"><span></span><span class="ativo"></span><span></span></span>
        <span class="padrao-tarefa"><span class="caixa"></span><span class="linha"></span></span>
        <span class="padrao-tarefa"><span class="caixa"></span><span class="linha curta"></span></span>
        <span class="padrao-tarefa"><span class="caixa"></span><span class="linha media"></span></span>
    </span>
    <span class="padrao-selo"><i class="bi bi-check2"></i></span>
</th:block>

<!-- Mario: uma fase em miniatura. Ao passar o mouse, o encanador pula, bate no bloco e solta uma moeda. -->
<th:block th:fragment="mario">
    <span class="mario-nuvens"><span class="mario-nuvem"></span><span class="mario-nuvem pequena"></span></span>
    <span class="mario-morro"></span>
    <span class="mario-arbusto"></span>
    <span class="mario-cano"></span>
    <span class="mario-blocos"><span class="tijolo"></span><span class="bloco"></span><span class="tijolo"></span></span>
    <span class="mario-moeda"></span>
    <span class="mario-encanador"></span>
    <span class="mario-inimigo"></span>
</th:block>

<!-- Minecraft: um pedaço de mundo. Ao passar o mouse, o minerador quebra o minério e sai um orbe de XP. -->
<th:block th:fragment="minecraft">
    <span class="mc-sol"></span>
    <span class="mc-nuvens"></span>
    <span class="mc-arvore"></span>
    <span class="mc-flor"></span>
    <span class="mc-minerio"></span>
    <span class="mc-orbe"></span>
    <span class="mc-minerador"></span>
    <span class="mc-criatura"></span>
</th:block>

<!-- Stardew Valley: a tela de título com um pedaço de fazenda na frente. Ao passar o mouse, a pastinaca cresce,
     a Abigail anda e a caixa de remessa solta uma moeda. -->
<th:block th:fragment="stardew">
    <span class="sv-ceu"></span>
    <span class="sv-nuvem"></span>
    <span class="sv-morros"></span>
    <span class="sv-chao"></span>
    <span class="sv-caixa"></span>
    <span class="sv-moeda"></span>
    <span class="sv-plantio"></span>
    <span class="sv-abigail"></span>
    <span class="sv-galinha"></span>
</th:block>

<!-- Counter-Strike 2: a arte-chave do jogo. Ao passar o mouse, a câmera aproxima, a AK-47 entra e sai um abate no killfeed. -->
<th:block th:fragment="cs2">
    <span class="cs-arte"></span>
    <span class="cs-logo"></span>
    <span class="cs-arma"></span>
    <span class="cs-kf"><span class="ct">Você</span><span class="kf-arma"></span><span class="kf-hs"></span><span class="t">Tarefa</span></span>
</th:block>

</body>
</html>
