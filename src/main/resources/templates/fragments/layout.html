<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Pedaços de tela reaproveitados por todas as páginas (th:replace="~{fragments/layout :: ...}"). -->

<head th:fragment="head(titulo)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${titulo} · Gerenciador de Tarefas|">Gerenciador de Tarefas</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- Temas além do Padrão trazem seu visual (tema.css) e suas animações/sons (tema.js) em static/temas/{slug}. -->
    <th:block th:if="${tema != null and !tema.padrao}">
        <link rel="stylesheet" th:href="@{/temas/{slug}/tema.css(slug=${tema.slug})}">
        <script defer th:src="@{/temas/{slug}/tema.js(slug=${tema.slug})}"></script>
    </th:block>
</head>

<body>

<nav th:fragment="menu(ativo)" class="navbar navbar-expand barra-app" data-bs-theme="dark">
    <div class="container flex-wrap">
        <a class="navbar-brand fw-semibold" th:href="@{/tarefas}"><i class="bi bi-check2-square me-1"></i>Gerenciador de Tarefas</a>
        <ul class="navbar-nav flex-wrap me-auto">
            <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'tarefas'} ? 'active'" th:href="@{/tarefas}"><i class="bi bi-list-check me-1"></i>Tarefas</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'categorias'} ? 'active'" th:href="@{/categorias}"><i class="bi bi-tags me-1"></i>Categorias</a></li>
            <th:block sec:authorize="hasRole('ADMIN')">
                <li class="nav-item d-flex align-items-center"><span class="rotulo-admin">Admin</span></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'usuarios'} ? 'active'" th:href="@{/admin/usuarios}"><i class="bi bi-people me-1"></i>Usuários</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'status'} ? 'active'" th:href="@{/admin/status}"><i class="bi bi-flag me-1"></i>Status</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'prioridades'} ? 'active'" th:href="@{/admin/prioridades}"><i class="bi bi-bar-chart-steps me-1"></i>Prioridades</a></li>
            </th:block>
        </ul>
        <div class="d-flex align-items-center gap-2">
            <a class="nav-link" th:classappend="${ativo == 'tema'} ? 'active'" th:href="@{/tema}"><i class="bi bi-palette me-1"></i>Tema</a>
            <a class="nav-link" th:classappend="${ativo == 'perfil'} ? 'active'" th:href="@{/perfil}"><i class="bi bi-person-circle me-1"></i><span sec:authentication="name">usuario</span></a>
            <!-- Sair é POST (com token CSRF), para um link externo não conseguir deslogar ninguém. -->
            <form class="m-0" th:action="@{/logout}" method="post">
                <button class="btn btn-sm btn-outline-light" type="submit"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
            </form>
        </div>
    </div>
</nav>

<th:block th:fragment="alertas">
    <div th:if="${sucesso}" class="alert alert-success d-flex gap-2 align-items-start" role="status">
        <i class="bi bi-check-circle"></i>
        <div th:text="${sucesso}">Mensagem de sucesso</div>
    </div>
    <div th:if="${erro}" class="alert alert-danger d-flex gap-2 align-items-start" role="alert">
        <i class="bi bi-x-circle"></i>
        <div th:text="${erro}">Mensagem de erro</div>
    </div>
</th:block>

<!-- pagina: Page do Spring Data; filtro: objeto com urlPagina(n); rotulo: "tarefas", "usuários"... -->
<div th:fragment="paginacao(pagina, filtro, rotulo)"
     class="card-footer bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
    <span class="small text-body-secondary" th:if="${pagina.numberOfElements > 0}"
          th:text="|Mostrando ${pagina.number * pagina.size + 1}–${pagina.number * pagina.size + pagina.numberOfElements} de ${pagina.totalElements} ${rotulo}|">Mostrando</span>
    <span class="small text-body-secondary" th:unless="${pagina.numberOfElements > 0}" th:text="|Total: ${pagina.totalElements} ${rotulo}|">Total</span>
    <nav aria-label="Paginação" th:if="${pagina.totalPages > 1}">
        <ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                <a class="page-link" th:href="@{${filtro.urlPagina(pagina.number - 1)}}">Anterior</a>
            </li>
            <li class="page-item" th:each="i : ${@paginacao.janela(pagina)}" th:classappend="${i == pagina.number} ? 'active'">
                <a class="page-link" th:href="@{${filtro.urlPagina(i)}}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                <a class="page-link" th:href="@{${filtro.urlPagina(pagina.number + 1)}}">Próxima</a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
