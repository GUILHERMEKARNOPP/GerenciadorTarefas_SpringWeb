<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('categorias')}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
        <div>
            <h1 class="h3 mb-1">Categorias</h1>
            <p class="text-body-secondary mb-0">Agrupe suas tarefas do jeito que preferir.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/categorias/nova}"><i class="bi bi-plus-lg me-1"></i>Nova categoria</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Tarefas</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${categorias.isEmpty()}">
                    <td colspan="4" class="text-center text-body-secondary py-5">
                        Você ainda não tem categorias. <a th:href="@{/categorias/nova}">Criar a primeira</a>
                    </td>
                </tr>
                <tr th:each="linha : ${categorias}">
                    <td class="fw-semibold" th:text="${linha.item().nome}">Nome</td>
                    <td>
                        <span th:if="${linha.item().descricao != null}" th:text="${linha.item().descricao}">Descrição</span>
                        <span th:unless="${linha.item().descricao != null}" class="text-body-tertiary">—</span>
                    </td>
                    <td th:text="${linha.tarefas()}">0</td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/categorias/{id}/editar(id=${linha.item().id})}" title="Editar" aria-label="Editar"><i class="bi bi-pencil"></i></a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/categorias/{id}/excluir(id=${linha.item().id})}" title="Excluir" aria-label="Excluir"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white">
            <span class="small text-body-secondary" th:text="|${categorias.size()} categoria(s)|">0 categorias</span>
        </div>
    </div>
</main>
</body>
</html>
