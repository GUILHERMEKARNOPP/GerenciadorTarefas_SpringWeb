<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- Confirmação usada por todas as exclusões: a exclusão em si só acontece no POST do botão "Sim, excluir". -->
<head th:replace="~{fragments/layout :: head(|Excluir ${confirmacao.entidade()}|)}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu(${confirmacao.menu()})}"></nav>
<main class="container py-4">
    <nav aria-label="Trilha">
        <ol class="breadcrumb small mb-2">
            <li class="breadcrumb-item"><a th:href="@{${confirmacao.urlLista()}}" th:text="${confirmacao.lista()}">Lista</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="|Excluir ${confirmacao.entidade()}|">Excluir</li>
        </ol>
    </nav>

    <div class="card zona-perigo cartao-confirmacao mx-auto mt-3">
        <div class="card-body p-4">
            <div class="d-flex gap-3 align-items-start">
                <div class="fs-2 text-danger lh-1"><i class="bi bi-exclamation-triangle"></i></div>
                <div>
                    <h1 class="h4 mb-1" th:text="|Excluir ${confirmacao.entidade()}?|">Excluir?</h1>
                    <p class="text-body-secondary mb-0">Confira os dados abaixo. Esta ação não pode ser desfeita.</p>
                </div>
            </div>
            <dl class="row mb-0 mt-4">
                <th:block th:each="campo : ${confirmacao.dados()}">
                    <dt class="col-sm-4 text-body-secondary fw-normal" th:text="${campo.rotulo()}">Campo</dt>
                    <dd class="col-sm-8" th:text="${campo.valor()}">Valor</dd>
                </th:block>
            </dl>
            <div class="alert alert-warning small mb-0 mt-3" th:if="${confirmacao.aviso() != null}">
                <i class="bi bi-exclamation-circle me-1"></i><span th:text="${confirmacao.aviso()}">Aviso</span>
            </div>
        </div>
        <form class="card-footer bg-white d-flex justify-content-end gap-2" th:action="@{${confirmacao.urlAcao()}}" method="post">
            <a class="btn btn-outline-secondary" th:href="@{${confirmacao.urlLista()}}">Cancelar</a>
            <button class="btn btn-danger" type="submit"><i class="bi bi-trash me-1"></i>Sim, excluir</button>
        </form>
    </div>
</main>
</body>
</html>
