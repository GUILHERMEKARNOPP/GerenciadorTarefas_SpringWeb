spring.application.name=GerenciadorTarefasWeb

# Banco de dados. A senha nunca fica no código: vem da variável de ambiente WEB_DB_PASSWORD,
# criada pelo script banco/setup-banco.ps1. URL e usuário podem ser trocados por WEB_DB_URL e WEB_DB_USER.
spring.datasource.url=${WEB_DB_URL:jdbc:postgresql://localhost:5432/gerenciador_web}
spring.datasource.username=${WEB_DB_USER:gerenciador_web}
spring.datasource.password=${WEB_DB_PASSWORD:}

# As tabelas são criadas pelo Flyway (src/main/resources/db/migration); o Hibernate só confere
# se as entidades batem com elas.
spring.jpa.hibernate.ddl-auto=validate
# Sem consultas escondidas durante a montagem da tela: cada serviço busca o que a tela precisa.
spring.jpa.open-in-view=false

# Erros para o usuário são genéricos (templates/error.html); detalhes ficam só no log do servidor.
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

# Cookie de sessão. Em produção com HTTPS, ligar também server.servlet.session.cookie.secure=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
