# Configuração de produção (perfil "prod", ligado pelo Dockerfile). Tudo o que muda de um servidor para
# outro vem de variáveis de ambiente, preenchidas no painel do Render.

# O Render informa em PORT a porta que o sistema deve usar.
server.port=${PORT:8080}

# O HTTPS termina no proxy do Render. "native" só confia nos cabeçalhos X-Forwarded-* que vêm da rede
# interna dele: assim o sistema sabe que a conexão é HTTPS e enxerga o IP real de quem acessa.
server.forward-headers-strategy=native

# O cookie de sessão só trafega por HTTPS.
server.servlet.session.cookie.secure=true

# Sem valor padrão de propósito: se faltar alguma variável, o sistema nem sobe, em vez de subir mal configurado.
spring.datasource.url=${WEB_DB_URL}
spring.datasource.username=${WEB_DB_USER}
spring.datasource.password=${WEB_DB_PASSWORD}
# Só a conta com este login vira administradora (ver ContaService).
app.admin.login=${ADMIN_LOGIN}

# Poucas conexões bastam para o plano gratuito e respeitam o limite do banco gerenciado.
spring.datasource.hikari.maximum-pool-size=5
